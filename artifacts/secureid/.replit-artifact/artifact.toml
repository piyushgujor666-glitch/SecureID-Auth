kind = "web"
previewPath = "/"
title = "SecureID"
description = "A production-minded identity platform with responsive registration, verification, login, and protected account experiences."
version = "1.0.0"
id = "artifacts/secureid"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20936

[services.development]
run = "pnpm --filter @workspace/secureid run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/secureid", "run", "build" ]
serve = "static"
publicDir = "artifacts/secureid/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20936"
BASE_PATH = "/"
